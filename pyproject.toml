[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markersub"
version = "0.1.0"
description = "Segment-wise lower-limb kinematics and kinetics for marker-based and markerless motion capture, with marker substitution analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Patrick Mai"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "ezc3d>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
